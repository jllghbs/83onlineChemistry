    <script>
        function closeAnnouncement() {
            document.getElementById('announcement').classList.add('hide');
            setTimeout(() => {
                document.getElementById('announcement').style.display = 'none';
            }, 400);
        }
        
        function updateCountdown() {
            const today = new Date();
            const examDate = new Date(today.getFullYear(), 5, 23, 10, 0, 0); // 6月23日10:00
            const timeDiff = examDate - today;
            
            if (timeDiff <= 0) {
                document.getElementById('countdown-container').style.display = 'none';
                return;
            }
            
            const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);
            
            const countdownElement = document.getElementById('countdown');
            const isMobile = window.innerWidth <= 768;
            
            if (isMobile) {
                countdownElement.innerHTML = `<div style="font-size: 14px; color: #5f52ff;">距离期末考试</div><div style="font-size: 22px; font-weight: bold; color: #5f52ff;">${days}天 ${hours}小时</div>`;
            } else {
                countdownElement.innerHTML = `<div style="font-size: 16px; color: #5f52ff;">距离期末考试</div><div style="font-size: 26px; font-weight: bold; color: #5f52ff;">${days}天 ${hours}小时 ${minutes}分 ${seconds}秒</div>`;
            }
        }
        
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>

    const date = new Date();
    const h = String(date.getHours()).padStart(2, '0');
    const m = String(date.getMinutes()).padStart(2, '0');
    return `${h}:${m}`;
}

    } else {
        wordCount.textContent = currentLength + '/200';
        wordCount.style.color = '#999';

    if (currentLength > 200) wordCount.style.color = '#ff4444';
});

- 被问到非化学问题：简短拒绝，说"抱歉，我只回答化学相关问题"
- 被问到你是谁：只说"我是高老师"
- 被问到开发者：告诉学生是胡锦乐`;

    const systemContent = currentMode === 'humor' ? humorSystemPrompt : formalSystemPrompt;

    const systemMessage = { role: "system", content: systemContent };
    const userMessage = { role: "user", content: userQuestion };

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${API_KEY}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "glm-4-flash",
                messages: [systemMessage, userMessage],
                temperature: 0.6,
                max_tokens: 500
            })
        });
        const data = await res.json();
        const answer = data.choices?.[0]?.message.content || "获取回答失败";

        const children = chatContainer.children;
        chatContainer.removeChild(children[children.length - 1]);

        if (currentMode === 'humor') {
            const sentences = answer.split(/[。.！!？?]/).filter(s => s.trim().length > 0);
            for (let i = 0; i < sentences.length; i++) {
                const sentence = sentences[i].trim();
                if (sentence) {
                    const aiChatHtml = `
                        <div class="ai-chat-item">
                            <div class="chat-avatar">
                                <img src="${TEACHER_AVATAR}" alt="AI高老师">
                            </div>
                            <div class="ai-chat-bubble">${marked.parse(sentence + '。')}</div>
                        </div>
                    `;
                    chatContainer.innerHTML += aiChatHtml;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    renderKateX();
                    if (i < sentences.length - 1) {
                        await new Promise(resolve => setTimeout(resolve, Math.random() * 4000 + 1000));
                    }
                }
            }
        } else {
            const aiChatHtml = `
                <div class="ai-chat-item">
                    <div class="chat-avatar">
                        <img src="${TEACHER_AVATAR}" alt="AI高老师">
                    </div>
                    <div class="ai-chat-bubble">${marked.parse(answer)}</div>
                </div>
            `;
            chatContainer.innerHTML += aiChatHtml;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            renderKateX();
        }
    } catch (e) {
        const errorHtml = `
            <div class="ai-chat-item">
                <div class="chat-avatar">
                    <img src="${TEACHER_AVATAR}" alt="AI高老师">
                </div>
                <div class="ai-chat-bubble">请求出错：${e.message}</div>
            </div>
        `;
        const children = chatContainer.children;
        chatContainer.removeChild(children[children.length - 1]);
        chatContainer.innerHTML += errorHtml;
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }
}

inputBox.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChat();
    }
});

function renderKateX() {
    if (typeof renderMathInElement !== 'undefined') {
        renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false},
                {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
        });
    }
}
